services:
  - type: web
    name: browsercontrol-relay
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: BROWSERCONTROL_GATEWAY_HOST
        value: 0.0.0.0
      - key: BROWSERCONTROL_ADMIN_TOKEN
        generateValue: true
      - key: BROWSERCONTROL_TRUST_PROXY
        value: "1"
      # For durable pairings, attach a persistent disk and set
      # BROWSERCONTROL_DEVICE_STORE_PATH to a file under its mount path.
