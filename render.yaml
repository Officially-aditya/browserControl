services:
  - type: web
    name: browsercontrol-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: BROWSERCONTROL_GATEWAY_HOST
        value: 0.0.0.0
      - key: BROWSERCONTROL_MCP_TOKEN
        generateValue: true
      - key: BROWSERCONTROL_ADMIN_TOKEN
        generateValue: true
      - key: BROWSERCONTROL_TRUST_PROXY
        value: "1"
