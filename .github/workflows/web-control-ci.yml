name: Web Control Pipeline CI

on:
  push:
    branches:
      - main
      - fix/release-hardening
  pull_request:
    paths:
      - 'src/**'
      - 'extension/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/web-control-ci.yml'

jobs:
  web-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSERCONTROL_CHROME_CI_NO_SANDBOX: "1"
      BROWSERCONTROL_CHROME_STARTUP_TIMEOUT_MS: "30000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chrome for Testing
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path /tmp/browsercontrol-cft
          CHROME_PATH=$(find /tmp/browsercontrol-cft -type f -path '*/chrome-linux64/chrome' -print -quit)
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Validate extension JavaScript
        run: |
          node --check extension/service-worker.js
          node --check extension/popup.js
          node --check extension/gateway-connection.js
          if [ -f extension/keyboard.js ]; then node --check extension/keyboard.js; fi
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:web
      - name: Extension unit tests
        run: npx vitest run tests/extension
      - name: Generate throwaway localhost TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/browsercontrol-test-key.pem \
            -out /tmp/browsercontrol-test-cert.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost"
          SPKI=$(openssl x509 -in /tmp/browsercontrol-test-cert.pem -pubkey -noout \
            | openssl pkey -pubin -outform der \
            | openssl dgst -sha256 -binary \
            | openssl base64 -A)
          echo "BROWSERCONTROL_TEST_TLS_SPKI=$SPKI" >> "$GITHUB_ENV"
      - name: Real Chrome extension → WSS gateway → MCP canary
        env:
          BROWSERCONTROL_TEST_TLS_KEY: /tmp/browsercontrol-test-key.pem
          BROWSERCONTROL_TEST_TLS_CERT: /tmp/browsercontrol-test-cert.pem
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: xvfb-run -a npx vitest run tests/integration/extension_gateway.integration.test.ts
