name: Web Control Pipeline CI

on:
  push:
    branches:
      - feature/web-control-pipeline
  pull_request:
    paths:
      - 'src/**'
      - 'extension/**'
      - 'tests/remote/**'
      - 'tests/integration/extension_gateway.integration.test.ts'
      - 'package*.json'
      - 'tsconfig.json'

jobs:
  web-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate extension JavaScript
        run: |
          node --check extension/service-worker.js
          node --check extension/popup.js
      - run: npm run build
      - run: npm run test:web
      - name: Real Chrome extension → gateway → MCP canary
        run: npx vitest run tests/integration/extension_gateway.integration.test.ts
